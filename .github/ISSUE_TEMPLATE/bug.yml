name: Bug
description: Something in git-bouncer doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version, OS and runtime
      description: Output of `bouncer --version` and `bouncer doctor`.
