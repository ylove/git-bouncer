name: Release

# Publishes git-bouncer to npm from a version tag, with npm trusted publishing: GitHub's OIDC token
# proves to npm which repo and workflow is publishing, so there is NO long-lived npm token anywhere.
# (This week's 1Password and SAP breaches both started from stolen developer tokens.)
#
# Runs only for a v*.*.* tag that matches package.json, and the publish job waits for approval
# in the "release" environment.
on:
  push:
    tags: ['v*.*.*']

permissions: {} # nothing at the workflow level; each job lists exactly what it needs

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the tagged commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # A release must never restore a cache that a pull request could have written.
          package-manager-cache: false

      - name: Tag must match package.json
        run: |
          want="v$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "$want" || { echo "Tag $GITHUB_REF_NAME does not match package.json ($want)"; exit 1; }

      - run: npm test

      - name: Pack and generate the CycloneDX SBOM
        run: |
          npm pack --json --ignore-scripts > pack.json
          node -p 'JSON.parse(require("node:fs").readFileSync("pack.json", "utf8"))[0].filename' > package-name.txt
          npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            *.tgz
            package-name.txt
            sbom.cdx.json
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub release and attach the package + SBOM
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files

      # Trusted publishing needs no token. NODE_AUTH_TOKEN is only set for the one-time first publish
      # (see RELEASING.md): a 1-day token stored on the release environment, then deleted.
      - name: Publish to npm with provenance
        run: npm publish "./$(cat package-name.txt)" --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release with the package and SBOM
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "./$(cat package-name.txt)" ./sbom.cdx.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
