name: Scorecard

# OpenSSF Scorecard grades this repo's own supply-chain hygiene (branch protection, pinned
# dependencies, token permissions, signed releases, ...) and publishes the result for the README badge.
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 7 * * 1'
  branch_protection_rule:

# One run per branch or PR; a newer push to the same PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {} # nothing at the workflow level; the job lists exactly what Scorecard needs

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the repo being graded
      actions: read # read workflow definitions and run history
      security-events: write # upload the results to the Security tab
      id-token: write # sign the published results so the badge can be trusted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 7

      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
