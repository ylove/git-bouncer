name: zizmor

# zizmor audits our GitHub Actions workflows for template injection, excessive permissions,
# credential persistence, unpinned actions and more. Findings fail the job.
on:
  push:
    branches: [main]
  pull_request:

# One run per branch or PR; a newer push to the same PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read # read the workflow files; findings are printed, not uploaded

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          version: 1.33.1
          persona: pedantic
          advanced-security: false
